- title: "Annealing machine-assisted learning of graph neural network for combinatorial optimization"
  authors: "P. Loyola, K. Hasegawa, A. Hoyos-Idrobo, K. Ono, T. Suzumura, Y. Hirate, M. Yamaoka"
  venue: "NeurIPS 2024 Workshop on Machine Learning with New Compute Paradigms"
  year: 2024
  bibkey: loyola2024annealing
  summary: "Partial solutions from an annealing machine, computed on a compressed version of the graph, guide a graph neural network so that it can solve combinatorial problems larger than the machine itself can handle."
  keywords: ["combinatorial optimization", "graph neural networks", "annealing machines"]
  url: "https://arxiv.org/abs/2501.05845"
  figure: "/img/papers/annealing-gnn.svg"
  figure_alt: "Annealing machine-assisted GNN: compress the graph, solve it on an annealing machine, use partial solutions to guide a GNN solver on the original graph"

