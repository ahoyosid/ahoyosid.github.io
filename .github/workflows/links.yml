name: Check links

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # every Monday, to catch links that rot over time

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec jekyll build
      - name: Check internal and external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/_site
            --accept 200..=299,429
            --max-retries 3
            --timeout 30
            './_site/**/*.html'
          fail: true
