<header class="site-header">
    
    <nav class="navbar navbar-inverse navbar-fixed-top">
    <div class="container">
        <div class="navbar-header">
            <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar" aria-expanded="false" aria-controls="navbar">
                <span class="sr-only">Toggle navigation</span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand" href="{{ site.baseurl }}/">andrés Hoyos-Idrobo</a>
        </div>
        <div id="navbar" class="collapse navbar-collapse">
            <ul class="nav navbar-nav navbar-right">
                {% assign nav_pages = site.pages | where_exp: "p", "p.nav_order" | sort: "nav_order" %}
                {% for my_page in nav_pages %}
                    {% if my_page.title %}
                    <li class="{% if my_page.url == page.url %} active {% endif %}">
                        <a role="presentation" href="{{ my_page.url | prepend: site.baseurl }}">{{ my_page.title }}</a>
                    </li>
                    {% endif %}
                {% endfor %}
            </ul>
        </div><!--/.nav-collapse -->
    </div>
    </nav>

    <!-- Bootstrap core JavaScript
    ================================================== -->
    <!-- Placed at the end of the document so the pages load faster -->
    <script>
        // Mobile navbar toggle (replaces Bootstrap's collapse plugin + jQuery)
        document.querySelectorAll('[data-toggle="collapse"]').forEach(function (button) {
            var target = document.querySelector(button.getAttribute('data-target'));
            button.addEventListener('click', function () {
                var open = target.classList.toggle('in');
                button.classList.toggle('collapsed', !open);
                button.setAttribute('aria-expanded', open);
            });
        });
    </script>
    <script>
        window.MathJax = { tex: { tags: 'ams' } };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>
</header>
