<script>
    // Zoom publication figures in place instead of opening them in a new tab.
    // Without JavaScript (or with Ctrl/Cmd/middle click) the link still opens the figure.
    (function () {
        var links = document.querySelectorAll('.pub-figure-link');
        if (!links.length || typeof HTMLDialogElement === 'undefined') return;

        var dialog = document.createElement('dialog');
        dialog.className = 'lightbox';
        dialog.innerHTML = '<button type="button" class="lightbox-close" aria-label="Close">&times;</button>' +
            '<figure><img alt=""><figcaption></figcaption></figure>';
        document.body.appendChild(dialog);
        var img = dialog.querySelector('img');
        var caption = dialog.querySelector('figcaption');

        dialog.querySelector('.lightbox-close').addEventListener('click', function () { dialog.close(); });
        // A click on the backdrop lands on the dialog element itself
        dialog.addEventListener('click', function (event) {
            if (event.target === dialog) dialog.close();
        });

        links.forEach(function (link) {
            link.addEventListener('click', function (event) {
                if (event.ctrlKey || event.metaKey || event.shiftKey || event.button !== 0) return;
                event.preventDefault();
                var thumb = link.querySelector('img');
                img.src = link.href;
                img.alt = thumb ? thumb.alt : '';
                caption.textContent = link.getAttribute('data-caption') || '';
                dialog.showModal();
            });
        });
    })();
</script>
